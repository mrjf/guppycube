name: Guppycube

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"

targets:
  Guppycube:
    type: application
    platform: iOS
    sources:
      - path: Guppycube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snagsby.guppycube
        PRODUCT_NAME: Guppycube
        INFOPLIST_FILE: Configuration/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - GuppycubeTests

  GuppycubeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GuppycubeTests
    dependencies:
      - target: Guppycube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snagsby.guppycube.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Guppycube.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Guppycube"
        BUNDLE_LOADER: "$(TEST_HOST)"

  GuppycubeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GuppycubeUITests
    dependencies:
      - target: Guppycube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snagsby.guppycube.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Guppycube
    scheme:
      testTargets:
        - GuppycubeUITests
